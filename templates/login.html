{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Guest Management</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    body {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
    }

    .login-card {
        background: #ffffff;
        border-radius: 18px;
        width: 100%;
        max-width: 420px;
        padding: 42px 34px;
        box-shadow:
            0 20px 25px -5px rgba(0, 0, 0, 0.30),
            0 10px 10px -5px rgba(0, 0, 0, 0.20);
    }

    .brand-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .logo-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 14px;
        border-radius: 16px;
        background: #4f46e5;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
    }

    .brand-header h1 {
        font-size: 1.55rem;
        color: #0f172a;
        font-weight: 700;
    }

    .brand-header p {
        color: #64748b;
        font-size: 0.85rem;
        margin-top: 6px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-wrapper i {
        position: absolute;
        left: 14px;
        color: #94a3b8;
        font-size: 1.2rem;
    }

    .input-wrapper input {
        width: 100%;
        padding: 13px 14px 13px 42px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s;
    }

    .input-wrapper input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .keep-login {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
    }

    .keep-login input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #4f46e5;
        cursor: pointer;
    }

    .keep-login label {
        font-size: 0.85rem;
        color: #475569;
        cursor: pointer;
        user-select: none;
    }

    .btn-login {
        width: 100%;
        padding: 13px;
        background: #4f46e5;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 10px;
    }

    .btn-login:hover {
        background: #4338ca;
    }

    .error-message {
        background: #fee2e2;
        color: #b91c1c;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        margin-bottom: 20px;
        text-align: center;
    }

    .footer-text {
        text-align: center;
        margin-top: 22px;
        color: #94a3b8;
        font-size: 0.75rem;
    }
</style>
```

</head>

<body>

```
<div class="login-card">

    <div class="brand-header">

        <div class="logo-icon">
            <i class="ph ph-buildings"></i>
        </div>

        <h1>Guest Management</h1>

        <p>Super Admin Portal</p>

    </div>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <div class="input-wrapper">

                <i class="ph ph-user"></i>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autofocus
                >

            </div>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <i class="ph ph-lock-key"></i>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

        </div>


        <div class="keep-login">

            <input
                type="checkbox"
                name="keep_login"
                id="keep_login"
                value="1"
            >

            <label for="keep_login">
                Keep me logged in
            </label>

        </div>


        <button type="submit" class="btn-login">
            <i class="ph ph-sign-in"></i>
            &nbsp; Sign In
        </button>

    </form>

    <div class="footer-text">
        Guest Management System
    </div>

</div>

</body>
</html>
